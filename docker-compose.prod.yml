version: "3.9"

services:
  sbootapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saj-history-service
    ports:
      - "${API_PORT}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      MONGO_URI: ${MONGO_URI}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    restart: always